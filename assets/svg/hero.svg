<svg xmlns="http://www.w3.org/2000/svg" width="840" height="260" viewBox="0 0 840 260" role="img" aria-label="Prathamesh Walse. Founder &amp; Chief Architect at Ultraceuticals. India's Premier AI-Native CRO.">
  <style>
    .m { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-weight: 700; letter-spacing: 2px; }
    .n { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -1px; }
    .s { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; font-weight: 600; }
  </style>

  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>

    <!-- Dark Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c14"/>
      <stop offset="60%" stop-color="#0b1420"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Animated Scan Beam -->
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Clip Path -->
    <clipPath id="card">
      <rect x="1" y="1" width="838" height="258" rx="18"/>
    </clipPath>
  </defs>

  <!-- Card Border & Background -->
  <rect x="0.5" y="0.5" width="839" height="259" rx="18" fill="url(#bg)" stroke="rgba(255,255,255,0.1)"/>

  <!-- Scanning Beam Effect -->
  <g clip-path="url(#card)">
    <rect width="840" height="260" fill="url(#grid)"/>
    <rect x="-240" y="0" width="240" height="260" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 1280 0" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Greeting & Identity -->
  <text class="m" x="44" y="60" fill="#38bdf8" font-size="11">BIOTECH ARCHITECT &amp; FOUNDER</text>
  <text class="n" x="40" y="116" fill="#f8fafc" font-size="52">Prathamesh Walse</text>

  <!-- Cycling Animated Titles -->
  <g>
    <text class="s" x="44" y="152" fill="rgba(255,255,255,0.85)" font-size="17">
      Founder &amp; Chief Architect — ULTRACEUTICALS
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.21;0.25;1" dur="14.0s" repeatCount="indefinite"/>
    </text>
    <text class="s" x="44" y="152" fill="rgba(255,255,255,0.85)" font-size="17" opacity="0">
      Pioneering India's Premier AI-Native CRO (48h Lead Sprints)
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.29;0.46;0.50;1" dur="14.0s" repeatCount="indefinite"/>
    </text>
    <text class="s" x="44" y="152" fill="rgba(255,255,255,0.85)" font-size="17" opacity="0">
      De Novo Generative Chemistry &amp; 1.8M-Node Graph Neural Networks
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.54;0.71;0.75;1" dur="14.0s" repeatCount="indefinite"/>
    </text>
    <text class="s" x="44" y="152" fill="rgba(255,255,255,0.85)" font-size="17" opacity="0">
      Predictive Solid-State Formulation AI (Tonset ±3.8°C Precision)
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.79;0.96;1" dur="14.0s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Live Status Badge -->
  <rect x="44" y="180" width="280" height="30" rx="15" fill="#10b98114" stroke="#10b98155"/>
  <circle cx="62" cy="195" r="4.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text class="m" x="76" y="199" fill="#10b981" font-size="10.5" style="letter-spacing:1.2px">FOUNDER, ULTRACEUTICALS</text>
  <text class="m" x="338" y="199" fill="rgba(255,255,255,0.6)" font-size="10.5" style="letter-spacing:1px">BENGALURU, INDIA</text>

  <!-- Constellation / Molecular Graph Network (Right Side) -->
  <g id="network">
    <!-- Edge Lines -->
    <line x1="610" y1="65" x2="690" y2="125" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <line x1="730" y1="55" x2="690" y2="125" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <line x1="785" y1="125" x2="690" y2="125" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <line x1="730" y1="195" x2="690" y2="125" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <line x1="610" y1="185" x2="690" y2="125" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <line x1="610" y1="65" x2="730" y2="55" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="730" y1="55" x2="785" y2="125" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="785" y1="125" x2="730" y2="195" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <line x1="730" y1="195" x2="610" y2="185" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Traveling Energy Particles -->
    <circle cx="610" cy="65" r="2.8" fill="#38bdf8">
      <animateMotion dur="2.4s" begin="0.00s" repeatCount="indefinite" path="M0 0 L80 60"/>
    </circle>
    <circle cx="730" cy="55" r="2.8" fill="#38bdf8">
      <animateMotion dur="2.4s" begin="0.48s" repeatCount="indefinite" path="M0 0 L-40 70"/>
    </circle>
    <circle cx="785" cy="125" r="2.8" fill="#38bdf8">
      <animateMotion dur="2.4s" begin="0.96s" repeatCount="indefinite" path="M0 0 L-95 0"/>
    </circle>
    <circle cx="730" cy="195" r="2.8" fill="#38bdf8">
      <animateMotion dur="2.4s" begin="1.44s" repeatCount="indefinite" path="M0 0 L-40 -70"/>
    </circle>
    <circle cx="610" cy="185" r="2.8" fill="#38bdf8">
      <animateMotion dur="2.4s" begin="1.92s" repeatCount="indefinite" path="M0 0 L80 -60"/>
    </circle>

    <!-- Node 1: DISCOVERA -->
    <circle cx="610" cy="65" r="18" fill="#0d1824" stroke="rgba(56,189,248,0.4)" stroke-width="1.3">
      <animate attributeName="r" values="18;19.5;18" dur="3s" begin="0.0s" repeatCount="indefinite"/>
    </circle>
    <text class="m" x="610" y="68.5" text-anchor="middle" fill="#38bdf8" font-size="9.5">DISCOV</text>

    <!-- Node 2: REVIVEAI -->
    <circle cx="730" cy="55" r="18" fill="#0d1824" stroke="rgba(20,184,166,0.4)" stroke-width="1.3">
      <animate attributeName="r" values="18;19.5;18" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <text class="m" x="730" y="58.5" text-anchor="middle" fill="#2dd4bf" font-size="9.5">REVIVE</text>

    <!-- Node 3: ENFORMIS -->
    <circle cx="785" cy="125" r="18" fill="#0d1824" stroke="rgba(245,158,11,0.4)" stroke-width="1.3">
      <animate attributeName="r" values="18;19.5;18" dur="3s" begin="1.0s" repeatCount="indefinite"/>
    </circle>
    <text class="m" x="785" y="128.5" text-anchor="middle" fill="#fbbf24" font-size="9.5">ENFORM</text>

    <!-- Node 4: DOSSIER360 -->
    <circle cx="730" cy="195" r="18" fill="#0d1824" stroke="rgba(168,85,247,0.4)" stroke-width="1.3">
      <animate attributeName="r" values="18;19.5;18" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <text class="m" x="730" y="198.5" text-anchor="middle" fill="#c084fc" font-size="9.5">DOSSIER</text>

    <!-- Node 5: GNN INTERACTOME -->
    <circle cx="610" cy="185" r="18" fill="#0d1824" stroke="rgba(56,189,248,0.4)" stroke-width="1.3">
      <animate attributeName="r" values="18;19.5;18" dur="3s" begin="2.0s" repeatCount="indefinite"/>
    </circle>
    <text class="m" x="610" y="188.5" text-anchor="middle" fill="#38bdf8" font-size="9.5">GNN</text>

    <!-- Center Nucleus: AI CRO -->
    <circle cx="690" cy="125" r="24" fill="#0369a124" stroke="#0284c7" stroke-width="1.6">
      <animate attributeName="r" values="24;26;24" dur="3s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <text class="m" x="690" y="129" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">AI CRO</text>
  </g>
</svg>
